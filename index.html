<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Market Watcher</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root { --ink: #102a43; --muted: #627d98; --paper: #f4f7f9; --line: #d9e2ec; --accent: #ef8354; --up: #18794e; --down: #c0392b; --white: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 90% 0%, #d8f3dc 0, transparent 35%), var(--paper); font-family: Georgia, "Yu Mincho", serif; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.5rem); line-height: .95; letter-spacing: 0; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font: 700 .78rem/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .updated { color: var(--muted); font: .78rem/1.5 Arial, sans-serif; text-align: right; }
    .updated::before { content: "LIVE DATA"; display: block; width: fit-content; margin: 0 0 8px auto; padding: 4px 8px; border: 1px solid #b7dec9; border-radius: 999px; color: var(--up); background: #effaf3; font-size: .65rem; font-weight: 700; letter-spacing: .1em; }
    main { display: grid; gap: 22px; margin-top: 28px; }
    section { background: rgba(255,255,255,.82); border: 1px solid var(--line); padding: 24px; box-shadow: 8px 8px 0 rgba(16,42,67,.07); }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 1.35rem; }
    .section-kicker { margin: 0; color: var(--muted); font: .72rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .toolbar label { color: var(--muted); font: 700 .72rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    select, button { min-height: 38px; border: 1px solid var(--ink); background: var(--white); color: var(--ink); padding: 0 12px; font: 700 .86rem Arial, sans-serif; }
    select { min-width: 150px; } button { cursor: pointer; } button[aria-pressed="true"] { background: var(--ink); color: white; }
    .chart-wrap { height: min(54vw, 410px); min-height: 260px; }
    .metrics { display: grid; gap: 10px; }
    .metric-row { display: grid; gap: 10px; }
    .metric-row.market-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric-row.context-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .snapshot-table { width: 100%; border-collapse: collapse; font: .78rem Arial, sans-serif; }
    .snapshot-table th, .snapshot-table td { border: 1px solid rgba(16,42,67,.38); padding: 9px 10px; text-align: center; white-space: nowrap; }
    .snapshot-table th { background: #e5e7eb; font-weight: 700; }
    .snapshot-table th:first-child, .snapshot-table td:first-child { width: 28%; text-align: left; }
    .snapshot-table td:first-child { font-weight: 700; }
    .snapshot-table .metric-change { display: block; margin: 0; text-align: center; }
    .metric { min-width: 0; border-top: 3px solid var(--accent); padding: 12px; background: var(--white); }
    .metric small { display: block; color: var(--muted); font: .76rem Arial, sans-serif; }
    .metric strong { display: block; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; font: 700 1.15rem Arial, sans-serif; white-space: nowrap; }
    .metric-change { display: flex; justify-content: space-between; gap: 6px; margin-top: 7px; font: 700 .72rem/1.35 Arial, sans-serif; overflow-wrap: anywhere; }
    .metric-change-label { min-width: 0; color: var(--muted); font-weight: 400; } .metric-change-value { min-width: 0; text-align: right; overflow-wrap: anywhere; }
    .dashboard-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
    .dashboard-tab { min-height: 48px; border: 1px solid var(--line); background: rgba(255,255,255,.72); color: var(--muted); font: 700 .88rem Arial, sans-serif; cursor: pointer; }
    .dashboard-tab[aria-selected="true"] { border-color: var(--ink); color: var(--white); background: var(--ink); }
    .snapshot-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .snapshot-tab { min-height: 40px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); font: 700 .82rem Arial, sans-serif; cursor: pointer; }
    .snapshot-tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); background: #fff7f2; }
    .dashboard-panel[hidden] { display: none; }
    [data-snapshot-panel][hidden] { display: none; }
    .metric-change.up { color: var(--up); } .metric-change.down { color: var(--down); } .metric-change.flat, .metric-change.missing { color: var(--muted); }
    .heatmap { overflow-x: auto; }
    .sector-table { width: 100%; min-width: 650px; border-collapse: collapse; font: .78rem Arial, sans-serif; }
    .sector-table th, .sector-table td { border: 1px solid rgba(16,42,67,.38); padding: 8px 10px; text-align: center; white-space: nowrap; }
    .sector-table th { background: #e5e7eb; font-weight: 700; }
    .sector-table th:first-child, .sector-table td:first-child { width: 30%; text-align: left; }
    .sector-table td:first-child { font-weight: 700; }
    .sector-value { font-variant-numeric: tabular-nums; }
    .note { color: var(--muted); font: .76rem/1.5 Arial, sans-serif; }
    .status { margin: 10px 0 0; color: var(--muted); font: .85rem Arial, sans-serif; }
    @media (max-width: 900px) { .metric-row.market-row, .metric-row.context-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .shell { width: min(100% - 20px, 1180px); padding-top: 24px; } header { display: block; } .updated { margin-top: 14px; text-align: left; } .updated::before { margin-left: 0; } section { padding: 16px; } .section-heading { display: block; } .section-kicker { margin-top: 5px; } .metric-row.market-row, .metric-row.context-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toolbar { align-items: stretch; } select { flex: 1; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><p class="eyebrow">Daily market intelligence</p><h1>Market<br>Watcher</h1></div><div class="updated" id="updated">読み込み中...</div></header>
    <div class="dashboard-tabs" role="tablist" aria-label="ダッシュボード表示切り替え"><button class="dashboard-tab" type="button" role="tab" data-dashboard-tab="snapshot" aria-selected="true">最新値</button><button class="dashboard-tab" type="button" role="tab" data-dashboard-tab="market" aria-selected="false">市場の推移</button><button class="dashboard-tab" type="button" role="tab" data-dashboard-tab="sectors" aria-selected="false">業種騰落率</button></div>
    <main>
      <section class="dashboard-panel" data-dashboard-panel="snapshot"><div class="section-heading"><h2>最新スナップショット</h2><p class="section-kicker">Latest close</p></div><div class="snapshot-tabs" role="tablist" aria-label="スナップショット分類"><button class="snapshot-tab" type="button" role="tab" data-snapshot-tab="market" aria-selected="true">株式指数</button><button class="snapshot-tab" type="button" role="tab" data-snapshot-tab="context" aria-selected="false">金利・為替</button><button class="snapshot-tab" type="button" role="tab" data-snapshot-tab="commodity" aria-selected="false">コモディティ</button></div><div class="metrics" id="metrics"></div></section>
      <section class="dashboard-panel" data-dashboard-panel="market" hidden><div class="section-heading"><h2>市場の推移</h2><p class="section-kicker">Historical movement</p></div><div class="toolbar"><label for="indicator">指標</label><select id="indicator"></select><button type="button" data-days="30" aria-pressed="true">30日</button><button type="button" data-days="90" aria-pressed="false">90日</button><button type="button" data-days="0" aria-pressed="false">全期間</button></div><div class="chart-wrap"><canvas id="market-chart"></canvas></div><p class="status" id="market-status"></p></section>
      <section class="dashboard-panel" data-dashboard-panel="sectors" hidden><div class="section-heading"><h2>TOPIX-17 業種騰落率</h2><p class="section-kicker">Ranked by daily change</p></div><div class="heatmap" id="heatmap"></div><p class="note" id="sector-status">直近ログの終値と期間別騰落率を表示しています。</p></section>
    </main>
  </div>
  <script>
    const state = { market: [], sectors: [], sectorDetails: [], days: 30, chart: null, dashboardTab: 'snapshot', snapshotTab: 'market' };
    const number = value => Number.isFinite(Number(value)) ? Number(value).toLocaleString('ja-JP', { maximumFractionDigits: 2 }) : 'データなし';
    const dateLabel = value => value ? value.replace(' ', 'T').slice(5, 16).replace('T', ' ') : '';
    function colorFor(value) { const strength = Math.min(Math.abs(value) / 3, 1); return value >= 0 ? `rgba(24,121,78,${.15 + strength * .65})` : `rgba(192,57,43,${.15 + strength * .65})`; }
    function parseCsv(path) { return new Promise((resolve, reject) => Papa.parse(path + '?v=' + Date.now(), { download: true, header: true, skipEmptyLines: true, complete: result => resolve(result.data), error: reject })); }
    const isDataColumn = key => key !== '日時' && !key.startsWith('__parsed_');
    function referenceRow(rows, latestDate, daysAgo) { const target = new Date(`${latestDate}T00:00:00`); target.setDate(target.getDate() - daysAgo); return rows.filter(row => row['日時'].slice(0, 10) <= target.toISOString().slice(0, 10)).at(-1); }
    function changeMarkup(label, current, reference) { const previous = Number(reference?.value); const difference = current - previous; const rate = previous ? difference / Math.abs(previous) * 100 : NaN; const direction = Number.isFinite(rate) ? rate > 0 ? 'up' : rate < 0 ? 'down' : 'flat' : 'missing'; const change = Number.isFinite(difference) && Number.isFinite(rate) ? `${difference >= 0 ? '+' : ''}${number(difference)} (${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%)` : 'データなし'; const referenceLabel = reference?.date ? ` (${reference.date.slice(5).replace('-', '/')})` : ''; return `<span class="metric-change ${direction}" title="比較日: ${reference?.date || 'なし'}"><span class="metric-change-label">${label}${referenceLabel}</span><span class="metric-change-value">${change}</span></span>`; }
    function changeCellMarkup(current, reference) { const previous = Number(reference?.value); const difference = current - previous; const rate = previous ? difference / Math.abs(previous) * 100 : NaN; const direction = Number.isFinite(rate) ? rate > 0 ? 'up' : rate < 0 ? 'down' : 'flat' : 'missing'; const change = Number.isFinite(rate) ? `${rate >= 0 ? '+' : ''}${rate.toFixed(2)}%` : '-'; return `<span class="metric-change ${direction}" title="比較日: ${reference?.date || 'なし'}"><span class="metric-change-value">${change}</span></span>`; }
    function validMarketRow(row) { const ranges = [['米10年金利', 0, 20], ['ドル円', 50, 250], ['WTI原油', 10, 250], ['銅', 1, 20], ['鉄鉱石', 10, 300], ['ゴールド', 500, 10000], ['S&P500', 1000, 20000], ['NASDAQ', 5000, 50000], ['NYダウ', 10000, 100000], ['VIX(恐怖指数)', 1, 200]]; return ranges.every(([key, min, max]) => { const value = Number(row[key]); return Number.isFinite(value) && value >= min && value <= max; }); }
    function renderMetrics() { const rows = state.market.filter(row => row['日時'] && validMarketRow(row)).sort((a, b) => a['日時'].localeCompare(b['日時'])); const latest = rows.at(-1); const el = document.querySelector('#metrics'); if (!latest) return; const latestDate = latest['日時'].slice(0, 10); const dataKeys = Object.keys(latest).filter(isDataColumn); const groups = { market: ['S&P500', 'NASDAQ', 'NYダウ'], context: ['米10年金利', 'ドル円'], commodity: ['WTI原油', '銅', '鉄鉱石'] }; const comparisonMarkup = (key, days) => { const reference = referenceRow(rows, latestDate, days); return changeCellMarkup(Number(latest[key]), { value: reference?.[key], date: reference?.['日時']?.slice(0, 10) }); }; const tableMarkup = (group, keys) => `<div class="metric-row ${group}-row" data-snapshot-panel="${group}"${state.snapshotTab === group ? '' : ' hidden'}><table class="snapshot-table"><thead><tr><th>名称</th><th>終値</th><th>1D</th><th>1W</th><th>1M</th><th>3M</th></tr></thead><tbody>${keys.filter(key => dataKeys.includes(key)).map(key => `<tr><td>${key}</td><td>${number(latest[key])}</td><td>${comparisonMarkup(key, 1)}</td><td>${comparisonMarkup(key, 7)}</td><td>${comparisonMarkup(key, 30)}</td><td>${comparisonMarkup(key, 90)}</td></tr>`).join('')}</tbody></table></div>`; el.innerHTML = Object.entries(groups).map(([group, keys]) => tableMarkup(group, keys)).join(''); document.querySelector('#updated').textContent = `最終更新 ${latest['日時']} / ${state.market.length} records`; }
    function renderSelect() { const keys = [...new Set(state.market.flatMap(row => Object.keys(row)))].filter(isDataColumn); document.querySelector('#indicator').innerHTML = keys.map(key => `<option value="${key}">${key}</option>`).join(''); }
    function renderChart() { const key = document.querySelector('#indicator').value; const rows = state.days ? state.market.slice(-state.days) : state.market; const ctx = document.querySelector('#market-chart'); if (state.chart) state.chart.destroy(); state.chart = new Chart(ctx, { type: 'line', data: { labels: rows.map(row => dateLabel(row['日時'])), datasets: [{ label: key, data: rows.map(row => Number(row[key])), borderColor: '#ef8354', backgroundColor: 'rgba(239,131,84,.14)', fill: true, pointRadius: rows.length > 60 ? 0 : 2, tension: .25 }] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: item => `${item.dataset.label}: ${number(item.raw)}` } } }, scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { ticks: { callback: value => number(value) } } } } }); document.querySelector('#market-status').textContent = `${key} / ${rows.length} records`; }
    function renderHeatmap() { const latestDate = state.sectorDetails.at(-1)?.['日時']; const latest = state.sectorDetails.filter(row => row['日時'] === latestDate).sort((a, b) => Number(b['1D']) - Number(a['1D'])); const el = document.querySelector('#heatmap'); if (!latest.length) { el.textContent = '業種詳細データがありません'; return; } const columns = [{ key: '終値', label: '終値', suffix: '' }, { key: '1D', label: '1D', suffix: '%' }, { key: '1W', label: '1W', suffix: '%' }, { key: '1M', label: '1M', suffix: '%' }, { key: '3M', label: '3M', suffix: '%' }]; const valueMarkup = (value, suffix) => { const numeric = Number(value); const display = Number.isFinite(numeric) ? `${numeric >= 0 && suffix === '%' ? '+' : ''}${numeric.toFixed(2)}${suffix}` : '-'; return `<td class="sector-value"${suffix === '%' && Number.isFinite(numeric) ? ` style="background:${colorFor(numeric)}"` : ''}>${display}</td>`; }; el.innerHTML = `<table class="sector-table"><thead><tr><th>名称</th>${columns.map(column => `<th>${column.label}</th>`).join('')}</tr></thead><tbody>${latest.map(row => `<tr><td>${row['業種']}</td>${columns.map(column => valueMarkup(row[column.key], column.suffix)).join('')}</tr>`).join('')}</tbody></table>`; document.querySelector('#sector-status').textContent = `${latest.length}業種 / ${latestDate} / 前日比の大きい順`; }
    async function load() { try { [state.market, state.sectors, state.sectorDetails] = await Promise.all([parseCsv('market_log.csv'), parseCsv('sector_log_jp.csv'), parseCsv('sector_detail_log_jp.csv')]); renderMetrics(); renderSelect(); renderChart(); renderHeatmap(); } catch (error) { document.querySelector('#updated').textContent = 'データを読み込めませんでした'; console.error(error); } }
    function renderDashboardTab() { document.querySelectorAll('[data-dashboard-tab]').forEach(button => button.setAttribute('aria-selected', button.dataset.dashboardTab === state.dashboardTab)); document.querySelectorAll('[data-dashboard-panel]').forEach(panel => { panel.hidden = panel.dataset.dashboardPanel !== state.dashboardTab; }); if (state.dashboardTab === 'market' && state.chart) state.chart.resize(); }
    document.querySelector('#indicator').addEventListener('change', renderChart); document.querySelectorAll('[data-days]').forEach(button => button.addEventListener('click', () => { state.days = Number(button.dataset.days); document.querySelectorAll('[data-days]').forEach(item => item.setAttribute('aria-pressed', item === button)); renderChart(); })); document.querySelectorAll('[data-dashboard-tab]').forEach(button => button.addEventListener('click', () => { state.dashboardTab = button.dataset.dashboardTab; renderDashboardTab(); })); document.querySelectorAll('[data-snapshot-tab]').forEach(button => button.addEventListener('click', () => { state.snapshotTab = button.dataset.snapshotTab; document.querySelectorAll('[data-snapshot-tab]').forEach(item => item.setAttribute('aria-selected', item === button)); renderMetrics(); })); load();
  </script>
</body>
</html>
